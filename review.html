<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review & Recognition - Nhà Giả Kim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS CHUNG & CSS RIÊNG CỦA REVIEW / RECOGNITION -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/recognition.css">
</head>
<body style="background-color: var(--bg-sand-surface);">

  <!-- Thanh điều hướng mini -->
  <div style="background: #14110e; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;">
    <a href="index.html" style="color: #e4c57c; font-family: var(--font-heading-royal); font-weight: 700;">&larr; VỀ TRANG CHỦ</a>
    <span style="color: #8e8372; font-size: 0.85rem;">FILE RIÊNG: review.html (CSS: css/recognition.css)</span>
  </div>

  <!-- NỘI DUNG 02 — RECOGNITION -->
  <section class="recognition-section" id="recognition" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container" style="width: 100%;">
      <div class="section-tag theme-light reveal-fade-up">
        <span class="number">02</span>
        <span class="line"></span>
        <span>RECOGNITION</span>
      </div>

      <div class="recognition-grid">
        <!-- The New York Times -->
        <div class="recognition-card reveal-fade-up delay-1">
          <div class="press-logo">
            <span class="press-logo-nyt">The New York Times</span>
          </div>
          <p class="press-quote">"An international literary phenomenon"</p>
        </div>

        <!-- BBC -->
        <div class="recognition-card reveal-fade-up delay-2">
          <div class="press-logo">
            <div class="press-logo-bbc">
              <span>B</span><span>B</span><span>C</span>
            </div>
          </div>
          <p class="press-quote">"Translated around the world"</p>
        </div>

        <!-- The Guardian -->
        <div class="recognition-card reveal-fade-up delay-3">
          <div class="press-logo">
            <span class="press-logo-guardian">The Guardian</span>
          </div>
          <p class="press-quote">"Loved by millions of readers"</p>
        </div>

        <!-- TIME -->
        <div class="recognition-card reveal-fade-up delay-4">
          <div class="press-logo">
            <span class="press-logo-time">TIME</span>
          </div>
          <p class="press-quote">"A modern classic"</p>
        </div>

        <!-- The Washington Post -->
        <div class="recognition-card reveal-fade-up delay-5">
          <div class="press-logo">
            <span class="press-logo-wapo">The Washington Post</span>
          </div>
          <p class="press-quote">"A book for every generation"</p>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
